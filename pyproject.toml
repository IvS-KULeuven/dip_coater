[tool.poetry]
name = "dip-coater"
version = "2.0.0"
description = "A terminal / Textual app to control a dip coater motor"
authors = [
    "Rik Huygen <rik.huygen@kuleuven.be>",
    "Sibo Van Gool <sibo.vangool@kuleuven.be>"
]
license = "MIT"
readme = "README.md"
packages = [
    {include = "dip_coater", from = "src"},
    {include = "trinamic_wrapper", from = "src/trinamic_wrapper"},
]
package-mode = true

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
textual = ">=0.73.0"
textual-dev = "*"
uvloop = { version = ">=0.19.0", markers = "sys_platform != 'win32'" }
winloop = { version = "*", markers = "sys_platform == 'win32'" }
pytrinamic = "^0.2.11"
tmc-2209-raspberry-pi = ">=0.5.2"
mock-gpio = "^0.1.8"
flake8 = "^7.1.0"

[tool.poetry.group.rpi]
optional = true

[tool.poetry.group.rpi.dependencies]
"RPi.GPIO" = ">=0.7.1"

[tool.poetry.scripts]
dip-coater = "dip_coater.app:main"

[tool.poetry.urls]
repository = "https://github.com/IvS-KULeuven/dip_coater"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "hardware: integration tests that require connected hardware",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
