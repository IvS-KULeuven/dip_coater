[project]
name = "dip-coater"
version = "2.0.6"
description = "A terminal / Textual app to control a dip coater motor"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [
    { name = "Rik Huygen", email = "rik.huygen@kuleuven.be" },
    { name = "Sibo Van Gool", email = "sibo.vangool@kuleuven.be" },
]
dependencies = [
    "mock-gpio>=0.1.8",
    "pytrinamic>=0.2.11,<0.3.0",
    "textual>=8.2.5",
    "tmc-2209-raspberry-pi>=0.5.2",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "winloop; sys_platform == 'win32'",
]

[project.optional-dependencies]
syntax = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]
rpi = [
    "gpiozero>=2.0",
    "gpiod>=2.1",
    "lgpio>=0.2.2",
    "RPi.GPIO>=0.7.1",
]

[project.scripts]
dip-coater = "dip_coater.app:run"

[project.urls]
Repository = "https://github.com/IvS-KULeuven/dip_coater"

[dependency-groups]
dev = [
    "flake8>=7.1.0",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.0",
    "textual-dev",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "dip_coater*",
    "MyTMC_2209*",
    "trinamic_wrapper*",
]
exclude = [
    "trinamic_wrapper.tests*",
]

[tool.setuptools.package-data]
dip_coater = [
    "*.md",
    "*.tcss",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "hardware: integration tests that require connected hardware",
    "hardware_motion: supervised hardware tests that physically move a motor",
]

[tool.coverage.run]
branch = true
source = ["dip_coater", "trinamic_wrapper"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
explicit_package_bases = true
files = [
    "src/dip_coater/mechanical/mechanical_setup.py",
    "src/dip_coater/setup_profiles/machine_profile.py",
    "src/dip_coater/setup_profiles/registry.py",
    "src/dip_coater/motor_driver/motor_driver_interface.py",
    "src/dip_coater/services/motion_controller.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
